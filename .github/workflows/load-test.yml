name: Load test

# Measured throughput, latency and cost of the served router (roadmap 7.4). Manual only: a run
# takes ~6 minutes. The image is built exactly as docker.yml builds it, then loaded at 1..32
# concurrent clients with the server pinned to 1 and then 2 CPUs. Results are an artifact;
# locally: gh run download <id> -n load-test -D load-test/
#          python scripts/load_test.py --report load-test/*.json

on:
  workflow_dispatch:

env:
  MODEL: minilm_ft_teacher
  MODEL_URL: https://github.com/sadiasamia121912/distilroute/releases/download/model-v1/minilm_ft_teacher.zip
  MODEL_SHA256: a1b09014263815d0e14613f1ce59fd68fafa2f33e82ea4c069aa70dcef5601c4

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the served model
        run: |
          curl -fsSL -o model.zip "$MODEL_URL"
          echo "$MODEL_SHA256  model.zip" | sha256sum -c -
          unzip -q model.zip && rm model.zip

      - name: Build
        run: docker build -t distilroute .

      - name: Runner
        run: |
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Load, 1 and 2 CPUs
        run: |
          for cpus in 1 2; do
            docker rm -f router 2>/dev/null || true
            docker run -d --name router --cpus="$cpus" -p 8000:8000 distilroute
            for i in $(seq 1 30); do curl -fs 127.0.0.1:8000/health >/dev/null && break; sleep 2; done
            python3 scripts/load_test.py --url http://127.0.0.1:8000 --cpus "$cpus" \
              --out "load_test_cpus$cpus.json"
          done

      - name: Summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          for p in sorted(glob.glob("load_test_cpus*.json")):
              r = json.load(open(p))
              print(f"### {r['cpus']:g} CPU(s), {r['model']}\n")
              print("| clients | req/s | p50 ms | p95 ms | p99 ms | errors |\n|---:|---:|---:|---:|---:|---:|")
              for lv in r["levels"]:
                  print(f"| {lv['clients']} | {lv['rps']:.0f} | {lv['p50_ms']:.1f} | {lv['p95_ms']:.1f} | {lv['p99_ms']:.1f} | {lv['errors']} |")
              print()
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: load-test
          path: load_test_cpus*.json

      - name: Container logs
        if: always()
        run: docker logs --tail 50 router || true
