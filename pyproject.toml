[project]
name = "distilroute"
version = "0.0.1"
description = "LLM-as-teacher -> tiny-student distillation for support-ticket routing (Banking77)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]  # Colab cells use ! and % magics
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
