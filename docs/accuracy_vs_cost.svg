<text x='60' y='367.2' font-size='12' fill='#8a8984' text-anchor='end'>0.80</text>
<line x1='70' x2='870' y1='296.4' y2='296.4' stroke='#e6e5e0' stroke-width='1'/>
<text x='60' y='300.4' font-size='12' fill='#8a8984' text-anchor='end'>0.82</text>
<line x1='70' x2='870' y1='229.6' y2='229.6' stroke='#e6e5e0' stroke-width='1'/>
<text x='60' y='233.6' font-size='12' fill='#8a8984' text-anchor='end'>0.84</text>
