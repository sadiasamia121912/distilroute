<text x='203.3' y='452' font-size='12' fill='#8a8984' text-anchor='middle'>$0.01</text>
<text x='336.7' y='452' font-size='12' fill='#8a8984' text-anchor='middle'>$0.1</text>
<text x='470.0' y='452' font-size='12' fill='#8a8984' text-anchor='middle'>$1</text>
<text x='603.3' y='452' font-size='12' fill='#8a8984' text-anchor='middle'>$10</text>
<text x='736.7' y='452' font-size='12' fill='#8a8984' text-anchor='middle'>$100</text>
