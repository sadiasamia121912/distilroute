<text x='333.9' y='247.1' font-size='13' fill='#1f1f1e' text-anchor='start'>DistilBERT</text>
<g><title>MiniLM → LLM below 0.8: accuracy 0.872, $27.40 per 1M</title><circle cx='661.7' cy='121.4' r='6' fill='#1baf7a' stroke='#fcfcfb' stroke-width='2'/></g>
<text x='661.7' y='107.4' font-size='13' fill='#1f1f1e' text-anchor='end'>MiniLM → LLM below 0.8</text>
<g><title>TF-IDF → MiniLM → LLM, cheapest match: accuracy 0.863, $5.26 per 1M</title><circle cx='566.1' cy='152.4' r='6' fill='#1baf7a' stroke='#fcfcfb' stroke-width='2'/></g>
<text x='554.1' y='157.4' font-size='13' fill='#1f1f1e' text-anchor='end'>TF-IDF → MiniLM → LLM, cheapest match</text>
<g><title>LLM alone: accuracy 0.867, $216.15 per 1M</title><circle cx='781.3' cy='138.7' r='6' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'/></g>
<text x='781.3' y='162.7' font-size='13' fill='#1f1f1e' text-anchor='middle'>LLM alone</text>
<text x='70' y='492' font-size='11' fill='#8a8984'>Banking77, 3,080 held-out queries vs human labels. Students never see a human label (3,000 LLM labels; served: 10,003, int8). scripts/readme_chart.py</text>
