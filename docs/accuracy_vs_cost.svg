<text x='245.9' y='154.8' font-size='13' fill='#1f1f1e' text-anchor='end'>MiniLM, 10k labels (served)</text>
<g><title>MiniLM, frozen: accuracy 0.848, $0.08 per 1M</title><circle cx='320.3' cy='201.6' r='6' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/></g>
