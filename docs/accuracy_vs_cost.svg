<g><title>TF-IDF + LR: accuracy 0.812, $0.01 per 1M</title><circle cx='214.7' cy='323.1' r='6' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/></g>
<text x='202.7' y='328.1' font-size='13' fill='#1f1f1e' text-anchor='end'>TF-IDF + LR</text>
<g><title>TinyBERT: accuracy 0.796, $0.01 per 1M</title><circle cx='223.3' cy='375.1' r='6' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/></g>
