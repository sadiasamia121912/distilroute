<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 500' width='900' height='500' font-family='ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif' role='img' aria-labelledby='t d'>
<title id='t'>Accuracy against cost for every system</title>
<desc id='d'>Accuracy on 3,080 Banking77 test queries against dollars per million requests, log scale. TF-IDF + LR: 0.812 at $0.01; TinyBERT: 0.796 at $0.01; MiniLM, fine-tuned, 3k labels: 0.847 at $0.03; MiniLM, 10k labels (served): 0.859 at $0.03; MiniLM, frozen: 0.848 at $0.08; DistilBERT: 0.839 at $0.08; MiniLM → LLM below 0.8: 0.872 at $27.40; TF-IDF → MiniLM → LLM, cheapest match: 0.863 at $5.26; LLM alone: 0.867 at $216.15.</desc>
